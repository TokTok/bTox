name: btox_call_media
description: Call audio and video for bTox.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: chat.tox.btox.call_media
        pluginClass: CallMediaPlugin
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
      windows:
        ffiPlugin: true
