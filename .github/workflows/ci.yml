name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel old builds when pushing new commits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common:
    uses: TokTok/ci-tools/.github/workflows/common-ci.yml@master

  prepare:
    name: Prepare
    uses: TokTok/ci-tools/.github/workflows/deploy-prepare.yml@master

  flutter:
    name: Flutter
    needs: [prepare]
    uses: TokTok/ci-tools/.github/workflows/flutter.yml@master
    with:
      project-name: btox
      flutter-version: "3.47.0"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  calls:
    name: Calls (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            device: linux
          - os: windows-2022
            device: windows
          - os: macos-26
            device: macos
          - os: macos-26
            device: ios
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Install dependencies
        if: runner.os == 'Linux'
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ninja-build libgtk-3-dev libsecret-1-dev xvfb
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start the Windows audio service
        if: runner.os == 'Windows'
        run: net start audiosrv
      - name: Let desktop apps use the microphone on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $store = 'Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($key in "HKLM:\$store", "HKCU:\$store", "HKCU:\$store\NonPackaged") {
            if (-not (Test-Path $key)) { New-Item -Path $key | Out-Null }
            Set-ItemProperty -Path $key -Name Value -Value Allow
          }
      - name: Generate files
        run: ./tools/prepare
      - name: Start an iPhone simulator
        if: matrix.device == 'ios'
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl privacy "$udid" grant microphone chat.tox.btox
          echo "DEVICE=$udid" >>"$GITHUB_ENV"
      - name: Run the call test
        run: ${{ runner.os == 'Linux' && 'xvfb-run' || '' }}
          flutter test integration_test/call_test.dart -d "$DEVICE"
